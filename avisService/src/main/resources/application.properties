spring.application.name=avisService
server.port=8768

# ===============================
# = Eureka Client
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8760/eureka

# ===============================
# = Base de données PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/event-project
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Garde la connexion active
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

# ===============================
# = JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Génération du schéma : update (à ajuster en prod => validate)
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Stratégie de nommage standard
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# = Spring Cloud Config
# ===============================
spring.cloud.config.enabled=false