<div class="signup-container">
  <div class="signup-card">
    <div class="signup-header">
      <h1>Inscription</h1>
      <p>Rejoignez notre communauté dès maintenant</p>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">

      <div class="form-row">
        <div class="form-group">
          <input formControlName="firstname" placeholder="Prénom" [class.error]="getFieldError('firstname')">
          <span class="error-message" *ngIf="getFieldError('firstname')">{{getFieldError('firstname')}}</span>
        </div>

        <div class="form-group">
          <input formControlName="lastname" placeholder="Nom" [class.error]="getFieldError('lastname')">
          <span class="error-message" *ngIf="getFieldError('lastname')">{{getFieldError('lastname')}}</span>
        </div>
      </div>

      <div class="form-group">
        <input formControlName="username" placeholder="Nom d'utilisateur" [class.error]="getFieldError('username')">
        <span class="error-message" *ngIf="getFieldError('username')">{{getFieldError('username')}}</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <input type="password" formControlName="password" placeholder="Mot de passe" [class.error]="getFieldError('password')">
          <span class="error-message" *ngIf="getFieldError('password')">{{getFieldError('password')}}</span>
        </div>

        <div class="form-group">
          <input type="password" formControlName="confirmPassword" placeholder="Confirmer" [class.error]="getFieldError('confirmPassword')">
          <span class="error-message" *ngIf="getFieldError('confirmPassword')">{{getFieldError('confirmPassword')}}</span>
        </div>
      </div>

      <div class="form-group">
        <input formControlName="phone" placeholder="Téléphone">
      </div>

      <div class="form-group">
        <label for="avatar">Photo de profil (optionnel)</label>
        <input type="file" id="avatar" (change)="onFileSelected($event)" accept="image/*" class="file-input">
      </div>

      <div class="form-group">
        <select formControlName="role">
          <option value="" disabled selected>Choisir un rôle</option>
          <option *ngFor="let role of roles" [value]="role">{{role}}</option>
        </select>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading || signupForm.invalid">
        <span *ngIf="isLoading">⏳ Création en cours...</span>
        <span *ngIf="!isLoading">S'inscrire</span>
      </button>
    </form>

    <div class="login-link">
      <p>Déjà un compte? <a routerLink="/login">Se connecter</a></p>
    </div>
  </div>
</div>
