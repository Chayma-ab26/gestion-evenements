<app-header-org></app-header-org>

<div class="dashboard">
  <!-- Header -->
  <div class="dashboard-header">
    <div class="header-content">

    </div>
    <div class="header-actions">
      <button (click)="createEvent()" class="btn primary">
        <i class="fas fa-plus"></i> Créer un événement
      </button>
      <button (click)="goToEventManagement()" class="btn secondary">
        <i class="fas fa-cog"></i> Gérer
      </button>
    </div>
  </div>

  <!-- Navigation rapide -->
  <div class="quick-nav">
    <div class="nav-item" (click)="goToEventManagement()">
      <i class="fas fa-calendar-alt"></i>
      <span>Événements</span>
    </div>
    <div class="nav-item" (click)="goToParticipants()">
      <i class="fas fa-users"></i>
      <span>Participants</span>
    </div>
    <div class="nav-item" (click)="goToReservations()">
      <i class="fas fa-building"></i>
      <span>Locaux</span>
    </div>
    <button (click)="exportData()" class="nav-item export">
      <i class="fas fa-download"></i>
      <span>Exporter</span>
    </button>
  </div>

  <!-- Statistiques -->
  <div class="stats">
    <div class="stat">
      <div class="icon-wrapper"><i class="fas fa-calendar-check"></i></div>
      <div class="content">
        <p class="label">Total Événements</p>
        <p class="value">{{ totalEvents }}</p>
      </div>
    </div>
   
    <div class="stat">
      <div class="icon-wrapper"><i class="fas fa-clock"></i></div>
      <div class="content">
        <p class="label">À Venir</p>
        <p class="value">{{ upcomingEvents }}</p>
      </div>
    </div>
  
     <div>
       <button class="nav-item2" (click)="goToProfile()">
          <i class="fas fa-user"></i> <span>Profil</span>
        </button>
    </div>
   
  </div>

  <!-- Événements récents -->
  <div class="recent">
    <div class="section-title">
      <h3>Événements Récents</h3>
      <button (click)="goToEventManagement()" class="link-btn">Voir tout</button>
    </div>

    <div class="events-list">
      <div *ngFor="let event of recentEvents" class="event" (click)="viewEvent(event)">
        <div class="info">
          <h4>{{ event.name }}</h4>
          <p class="meta"><i class="fas fa-calendar"></i> {{ formatDate(event.datedebut) }}</p>
          <p class="meta"><i class="fas fa-users"></i> {{ event.participants }} participants</p>
        </div>
        
      </div>
    </div>

    <div *ngIf="recentEvents.length === 0" class="empty-state">
      <div class="empty-icon"><i class="fas fa-calendar-xmark"></i></div>
      <h4>Aucun événement</h4>
      <p>Commencez par créer votre premier événement.</p>
      <button (click)="createEvent()" class="btn primary small">
        <i class="fas fa-plus"></i> Créer un événement
      </button>
    </div>
  </div>
</div>
