
<app-admin-header></app-admin-header>

<div class="modern-dashboard">
  <!-- Header du dashboard -->
  <div class="dashboard-header">
    <div class="header-content">
    </div>
    <div class="header-actions">
    
    
    </div>
  </div>

  <!-- Chargement -->
  <div *ngIf="isLoading" class="loading-section">
    <div class="loading-spinner"></div>
    <p>Chargement des données...</p>
  </div>

  <!-- Statistiques principales -->
  <div *ngIf="!isLoading" class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-users"></i>
      </div>
      <div class="stat-content">
        <h3>Total Utilisateurs</h3>
        <p class="stat-number">{{ totalUsers }}</p>
        <span class="stat-change positive">
          <i class="fas fa-users"></i> Inscrits
        </span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-calendar-alt"></i>
      </div>
      <div class="stat-content">
        <h3>Total Événements</h3>
        <p class="stat-number">{{ totalEvents }}</p>
        <span class="stat-change positive">
          <i class="fas fa-calendar"></i> Créés
        </span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-building"></i>
      </div>
      <div class="stat-content">
        <h3>Total Locaux</h3>
        <p class="stat-number">{{ totalLocals }}</p>
        <span class="stat-change">
          <i class="fas fa-building"></i> Disponibles
        </span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-tags"></i>
      </div>
      <div class="stat-content">
        <h3>Total Catégories</h3>
        <p class="stat-number">{{ totalCategories }}</p>
        <span class="stat-change positive">
          <i class="fas fa-tag"></i> Configurées
        </span>
      </div>
    </div>
  </div>

  <!-- Menu de navigation rapide -->
  <div *ngIf="!isLoading" class="quick-nav">
    
       <button class="nav-item" (click)="goToProfile()">
          <i class="fas fa-user"></i> <span>Profil</span>
        </button>
        
      <button class="nav-item" (click)="exportData()">
        <i class="fas fa-download"></i>
        <span>Exporter Données</span>
      </button>
  </div>


 
</div>
