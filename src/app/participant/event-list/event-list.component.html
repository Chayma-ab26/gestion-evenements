<app-header-part></app-header-part>
<h1>Événements disponibles</h1>

<!-- Indicateur de chargement -->
<div *ngIf="isLoading" class="loading-container">
  <div class="loading-spinner"></div>
  <p>Chargement des événements...</p>
</div>

<!-- Filtres -->
<div *ngIf="!isLoading" class="filters-container">
  <div class="search-box">
    <input type="text" placeholder="Rechercher un événement..." class="search-input">
  </div>
</div>

<!-- Liste des événements -->
<div *ngIf="!isLoading && filteredEvents.length > 0" class="events-container">
  <div *ngFor="let event of filteredEvents; trackBy: trackByEventId" class="event-card">
    <div class="event-image-container">
      <ng-container *ngIf="getLocalImages(event).length > 0; else noLocalBlock">
        <div class="local-gallery">
          <div class="main-image">
            <img [src]="getMainImage(event)" [alt]="getLocalName(event)" class="event-image" />
          </div>
          <div class="thumbnails">
            <img *ngFor="let img of getLocalImages(event); let i = index"
                 [src]="'api/locals/files/' + img"
                 [class.active]="i === (selectedImageIndex[event.id] || 0)"
                 (click)="selectImage(event.id, i)" />
          </div>
        </div>
      </ng-container>
      <ng-template #noLocalBlock>
        <div class="no-image-placeholder">
          <i class="fas fa-map-marker-alt"></i>
          <p>Aucun local associé à cet événement</p>
        </div>
      </ng-template>
    </div>

    <div class="event-content">
      <h3>{{ event.title }}</h3>
      <p>{{ event.description }}</p>

      <!-- Actions -->
      <div class="event-actions">
        
        <button class="btn btn-primary" (click)="participateEvent(event.id)">
          <i class="fas fa-user-plus"></i> Participer
        </button>
        <button class="btn btn-secondary" (click)="payOnline(event)">
          <i class="fas fa-credit-card"></i> Payer en ligne
        </button>
      </div>

      <!-- Avis -->
      <div class="rating-section">
        <input [(ngModel)]="newCommentaire[event.id]" placeholder="Laissez un avis..." class="review-input" />
        <div class="star-rating">
          <i class="fas fa-star" *ngFor="let star of [1,2,3,4,5]; let i = index"
             [class.active]="i < (newRating[event.id] || 0)"
             (click)="newRating[event.id] = i + 1"
             (mouseenter)="hoverRating[event.id] = i + 1"
             (mouseleave)="hoverRating[event.id] = 0"></i>
        </div>
        <button class="btn btn-outline" (click)="submitAvis(event.id, newRating[event.id], newCommentaire[event.id])">
          Envoyer
        </button>
      </div>
    </div>
  </div>
</div>

<!-- État vide -->
<div *ngIf="!isLoading && filteredEvents.length === 0" class="empty-state">
  <i class="fas fa-calendar-times"></i>
  <h3>Aucun événement trouvé</h3>
</div>

<app-footer></app-footer>
