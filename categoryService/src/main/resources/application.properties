spring.application.name=categoryService
server.port=8762
eureka.client.service-url.defaultZone=http://localhost:8760/eureka


#spring.datasource.url=jdbc:mysql://localhost:3306/mydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# Identifiants de la base de données
#spring.datasource.username=root
#spring.datasource.password=
# Garder la connexion ouverte si elle est inactive (production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

####
spring.datasource.url=jdbc:postgresql://localhost:5432/event-project
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.default_schema=public

# ===============================
# = JPA / HIBERNATE
# ===============================

# Type de pilote
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#needed to add a connector dependency to recognize the driver
# Afficher les requêtes SQL dans les logs
spring.jpa.show-sql=true

# Hibernate ddl-auto : "update" met à jour le schéma en fonction des entités Java
spring.jpa.hibernate.ddl-auto=update

# Stratégie de nommage des tables et colonnes
#spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Dialecte spécifique à MySQL
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Formatage SQL et commentaires
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.cloud.config.enabled=false